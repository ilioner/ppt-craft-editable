<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase D - PDF 内容提取预览</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-elevated: rgba(16, 22, 31, 0.88);
      --bg-panel: rgba(18, 26, 37, 0.82);
      --bg-panel-strong: rgba(10, 16, 24, 0.94);
      --line: rgba(229, 221, 199, 0.12);
      --line-strong: rgba(229, 221, 199, 0.24);
      --text: #f4efe4;
      --muted: #b7b0a0;
      --muted-soft: #8f887c;
      --accent: #6ec6ff;
      --accent-strong: #95d7ff;
      --accent-warm: #f4b860;
      --danger: #ff8f7a;
      --success: #4ec49a;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
      --panel-radius: 28px;
      --inner-radius: 22px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(110, 198, 255, 0.16), transparent 34%),
        radial-gradient(circle at 85% 12%, rgba(244, 184, 96, 0.14), transparent 26%),
        linear-gradient(135deg, #091019 0%, #0c131c 36%, #121a25 100%);
      position: relative;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent 78%);
    }
    body::after {
      opacity: 0.18;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.85) 0.7px, transparent 0.7px),
        radial-gradient(circle at 80% 40%, rgba(255,255,255,0.5) 0.7px, transparent 0.7px),
        radial-gradient(circle at 35% 80%, rgba(255,255,255,0.45) 0.7px, transparent 0.7px);
      background-size: 18px 18px, 24px 24px, 22px 22px;
    }
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 18px;
      height: 100vh;
      padding: 18px;
    }
    /* 左侧原图预览 */
    .preview-pane {
      width: 52%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(15, 22, 31, 0.93), rgba(8, 14, 21, 0.88));
      border: 1px solid var(--line);
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }
    .preview-header {
      padding: 18px 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent),
        rgba(10, 16, 24, 0.72);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .page-nav {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .page-nav button {
      padding: 9px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.03em;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }
    .page-nav button:hover:not(:disabled) {
      background: rgba(110, 198, 255, 0.12);
      border-color: rgba(110, 198, 255, 0.34);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
      transform: translateY(-1px);
    }
    .page-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .page-info {
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Songti SC", serif;
      font-size: 16px;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .preview-canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      overflow: auto;
      background:
        radial-gradient(circle at top, rgba(110, 198, 255, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.01), transparent 22%);
    }
    .preview-canvas {
      position: relative;
      width: min(100%, 940px);
      border-radius: 24px;
      overflow: visible;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.38);
    }
    .preview-canvas img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      background: rgba(255,255,255,0.02);
    }
    .text-box-overlay {
      position: absolute;
      border: 1.5px solid rgba(110, 198, 255, 0.8);
      background: linear-gradient(180deg, rgba(110, 198, 255, 0.16), rgba(110, 198, 255, 0.08));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.2s ease;
    }
    .text-box-overlay:hover {
      background: linear-gradient(180deg, rgba(110, 198, 255, 0.24), rgba(110, 198, 255, 0.12));
      border-color: var(--accent-strong);
      transform: scale(1.01);
    }
    .text-box-overlay.selected {
      border-color: rgba(244, 184, 96, 0.96);
      background: linear-gradient(180deg, rgba(244, 184, 96, 0.24), rgba(244, 184, 96, 0.14));
      box-shadow: 0 0 0 1px rgba(244, 184, 96, 0.25);
    }
    .text-box-label {
      position: absolute;
      top: -18px;
      left: 10px;
      background: rgba(8, 14, 21, 0.92);
      color: var(--accent-strong);
      border: 1px solid rgba(110, 198, 255, 0.26);
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
    }
    .text-box-overlay.selected .text-box-label {
      color: #ffd59a;
      border-color: rgba(244, 184, 96, 0.32);
    }
    /* 右侧编辑面板 */
    .editor-pane {
      width: 48%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(12, 19, 28, 0.94), rgba(8, 13, 20, 0.92));
      border: 1px solid var(--line);
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }
    .editor-header {
      padding: 24px 24px 18px;
      background:
        radial-gradient(circle at top right, rgba(244, 184, 96, 0.12), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent),
        rgba(13, 19, 28, 0.92);
      border-bottom: 1px solid var(--line);
    }
    .editor-header h2 {
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Songti SC", serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }
    .page-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 999px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge.clean { background: rgba(78, 196, 154, 0.18); color: #9cedcb; }
    .badge.rebuild { background: rgba(244, 184, 96, 0.18); color: #ffd59a; }
    .badge.simple { background: rgba(255,255,255,0.08); color: #ebe2d0; }
    .badge.complex { background: rgba(255, 143, 122, 0.16); color: #ffb5a5; }
    .text-boxes-list {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.015), transparent 12%),
        rgba(10, 15, 22, 0.4);
    }
    .text-box-item {
      background: linear-gradient(180deg, rgba(19, 28, 39, 0.96), rgba(11, 18, 26, 0.96));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--inner-radius);
      padding: 16px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      box-shadow: 0 14px 36px rgba(0,0,0,0.18);
    }
    .text-box-item:hover {
      border-color: rgba(110, 198, 255, 0.18);
      transform: translateY(-1px);
    }
    .text-box-item.selected {
      border-color: rgba(244, 184, 96, 0.36);
      background: linear-gradient(180deg, rgba(42, 33, 19, 0.92), rgba(19, 18, 16, 0.96));
      box-shadow: 0 20px 40px rgba(0,0,0,0.24);
    }
    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }
    .box-role {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent-strong);
    }
    .box-confidence {
      font-size: 11px;
      color: var(--muted-soft);
    }
    .box-confidence.low {
      color: #ffb5a5;
    }
    .box-text {
      margin-bottom: 12px;
    }
    .box-text textarea {
      width: 100%;
      background: rgba(5, 10, 16, 0.56);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.55;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      resize: vertical;
      min-height: 72px;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }
    .box-text textarea:focus {
      outline: none;
      border-color: rgba(110, 198, 255, 0.46);
      background: rgba(8, 14, 22, 0.76);
      box-shadow: 0 0 0 4px rgba(110, 198, 255, 0.08);
    }
    .box-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .box-actions select,
    .box-actions button {
      padding: 8px 12px;
      font-size: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }
    .box-actions select:hover,
    .box-actions button:hover {
      border-color: rgba(110, 198, 255, 0.24);
      background: rgba(255,255,255,0.06);
      transform: translateY(-1px);
    }
    .box-actions button.danger {
      background: rgba(255, 143, 122, 0.14);
      border-color: rgba(255, 143, 122, 0.24);
      color: #ffd0c8;
    }
    .editor-footer {
      padding: 18px 22px 20px;
      background:
        linear-gradient(180deg, transparent, rgba(255,255,255,0.015)),
        rgba(9, 14, 20, 0.96);
      border-top: 1px solid var(--line);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      padding: 12px 20px;
      background: linear-gradient(135deg, #8fd7ff, #5ba9ff);
      border: none;
      color: #0b1521;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.05em;
      box-shadow: 0 18px 34px rgba(91, 169, 255, 0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 38px rgba(91, 169, 255, 0.28);
      filter: brightness(1.03);
    }
    .btn-secondary {
      padding: 11px 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.09);
      color: var(--text);
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.03em;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(110, 198, 255, 0.22);
      transform: translateY(-1px);
    }
    .issues-banner {
      background: rgba(255, 143, 122, 0.12);
      border: 1px solid rgba(255, 143, 122, 0.26);
      color: #ffd0c8;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 12px;
      letter-spacing: 0.04em;
      margin-left: auto;
    }
    #overlayContainer {
      position: absolute;
      inset: 0;
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.14);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
    }
    .preview-pane,
    .editor-pane,
    .text-box-item,
    .preview-canvas {
      animation: rise-in 0.55s ease both;
    }
    .editor-pane { animation-delay: 0.06s; }
    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 1100px) {
      body {
        overflow: auto;
      }
      .app {
        height: auto;
        min-height: 100vh;
        flex-direction: column;
      }
      .preview-pane,
      .editor-pane {
        width: 100%;
        min-height: 46vh;
      }
    }
    @media (max-width: 720px) {
      .app {
        gap: 14px;
        padding: 12px;
      }
      .preview-header,
      .editor-header,
      .editor-footer {
        padding-left: 16px;
        padding-right: 16px;
      }
      .editor-header h2 {
        font-size: 24px;
      }
      .preview-canvas-wrapper,
      .text-boxes-list {
        padding: 14px;
      }
      .page-nav {
        gap: 8px;
      }
      .page-nav button,
      .btn-secondary,
      .btn-primary {
        width: 100%;
        justify-content: center;
      }
      .issues-banner {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左侧：原图预览 + 文本框 overlay -->
    <div class="preview-pane">
      <div class="preview-header">
        <div class="page-nav">
          <button id="prevPage">← 上一页</button>
          <span class="page-info" id="pageInfo">Page 1 / 12</span>
          <button id="nextPage">下一页 →</button>
        </div>
        <button class="btn-secondary" id="toggleOverlay">隐藏标注</button>
      </div>
      <div class="preview-canvas-wrapper">
        <div class="preview-canvas" id="previewCanvas">
          <img id="pageImage" src="" alt="Page preview">
          <div id="overlayContainer"></div>
        </div>
      </div>
    </div>

    <!-- 右侧：文本框编辑 -->
    <div class="editor-pane">
      <div class="editor-header">
        <div class="page-info" style="margin-bottom: 10px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;">Phase D Content Review</div>
        <h2>内容提取 - Page <span id="currentPageNum">1</span></h2>
        <div class="page-meta">
          <div class="meta-item">
            <span>背景策略:</span>
            <span class="badge clean" id="strategyBadge">clean</span>
          </div>
          <div class="meta-item">
            <span>复杂度:</span>
            <span class="badge simple" id="complexityBadge">simple</span>
          </div>
        </div>
      </div>
      <div class="text-boxes-list" id="textBoxesList">
        <!-- 动态生成的文本框列表 -->
      </div>
      <div class="editor-footer">
        <button class="btn-secondary" id="addBoxBtn">+ 添加文本框</button>
        <button class="btn-primary" id="exportBtn">✓ 导出确认</button>
        <div class="issues-banner" id="issuesBanner" style="display: none;">
          ⚠ 2 处需要复核
        </div>
      </div>
    </div>
  </div>

  <script>
    // 示例数据结构（实际使用时会由 inject_extraction_review.py 注入）
    let extractionData = {
  "source_pdf": "badname.pdf",
  "total_pages": 1,
  "aspect_ratio": "16:9",
  "pages": [
    {
      "page_index": 1,
      "page_type": "content",
      "page_image": "tmp_phase_d_validation/phaseD/work/page_images/01.png",
      "background_strategy": "clean",
      "background_complexity": "simple",
      "text_boxes": [
        {
          "id": "p1_t1",
          "role": "title",
          "text": "HelloWorld",
          "bbox_norm": [
            0.1,
            0.2,
            0.5,
            0.1
          ],
          "font_size_est": 22,
          "style_hint": {
            "align": "left",
            "weight": "bold",
            "color": "#111111",
            "italic": false
          },
          "confidence": 0.9,
          "needs_review": false
        }
      ],
      "issues": []
    }
  ]
};

    let currentPageIndex = 0;
    let selectedBoxId = null;
    let overlayVisible = true;

    function sanitizeText(value) {
      return String(value ?? '')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g, '')
        .replace(/[\uD800-\uDFFF]/g, '');
    }

    function sanitizeLabel(value, fallback = 'body') {
      const cleaned = sanitizeText(value).trim();
      return cleaned || fallback;
    }

    function sanitizeImageSource(value) {
      return sanitizeText(value).trim();
    }

    function ensureStyleHint(box) {
      if (!box.style_hint || typeof box.style_hint !== 'object') {
        box.style_hint = {};
      }
      if (!box.style_hint.align) box.style_hint.align = 'left';
      if (!box.style_hint.weight) box.style_hint.weight = 'regular';
      if (!box.style_hint.color) box.style_hint.color = '#1A1A1A';
      if (typeof box.style_hint.italic !== 'boolean') box.style_hint.italic = false;
    }

    function normalizeBox(box, pageIndex, idOverride = null) {
      ensureStyleHint(box);
      if (!Array.isArray(box.bbox_norm) || box.bbox_norm.length !== 4) {
        box.bbox_norm = [0.1, 0.1, 0.8, 0.12];
      }
      box.id = idOverride || box.id || nextBoxId(pageIndex);
      box.role = sanitizeLabel(box.role, 'body');
      box.text = sanitizeText(box.text);
      if (typeof box.font_size_est !== 'number') box.font_size_est = 18;
      if (typeof box.confidence !== 'number') box.confidence = 0.9;
      if (typeof box.needs_review !== 'boolean') box.needs_review = false;
      return box;
    }

    function normalizePage(page, pageIndex) {
      if (!Array.isArray(page.text_boxes)) page.text_boxes = [];
      let nextId = 1;
      page.text_boxes = page.text_boxes.map(box => {
        const boxId = box.id || `p${page.page_index}_t${nextId++}`;
        const match = String(boxId).match(/_t(\d+)$/);
        if (match) nextId = Math.max(nextId, parseInt(match[1], 10) + 1);
        return normalizeBox(box, pageIndex, boxId);
      });
      if (!Array.isArray(page.issues)) page.issues = [];
      page.page_image = sanitizeImageSource(page.page_image);
      page.page_type = sanitizeLabel(page.page_type, 'content');
      if (!page.background_strategy) page.background_strategy = 'clean';
      if (!page.background_complexity) page.background_complexity = 'simple';
      return page;
    }

    function nextBoxId(pageIndex) {
      const page = extractionData.pages[pageIndex];
      const prefix = `p${page.page_index}_t`;
      const maxId = page.text_boxes.reduce((max, box) => {
        const match = String(box.id || '').match(/_t(\d+)$/);
        return match ? Math.max(max, parseInt(match[1], 10)) : max;
      }, 0);
      return `${prefix}${maxId + 1}`;
    }

    function createDefaultBox(pageIndex) {
      return normalizeBox({
        id: nextBoxId(pageIndex),
        role: 'body',
        text: '',
        bbox_norm: [0.1, 0.1, 0.8, 0.12],
        font_size_est: 18,
        style_hint: { align: 'left', weight: 'regular', color: '#1A1A1A', italic: false },
        confidence: 0.6,
        needs_review: true
      }, pageIndex);
    }

    // 初始化
    function init() {
      extractionData.pages = (extractionData.pages || []).map((page, index) => normalizePage(page, index));
      renderPage(currentPageIndex);
      setupEventListeners();
    }

    // 渲染当前页面
    function renderPage(pageIdx) {
      const page = extractionData.pages[pageIdx];
      if (!page) return;

      // 更新页面信息
      document.getElementById('pageInfo').textContent = `Page ${page.page_index} / ${extractionData.total_pages}`;
      document.getElementById('currentPageNum').textContent = page.page_index;
      const pageImage = document.getElementById('pageImage');
      try {
        pageImage.src = sanitizeImageSource(page.page_image);
      } catch (_error) {
        pageImage.removeAttribute('src');
      }

      // 更新背景策略和复杂度
      const strategyBadge = document.getElementById('strategyBadge');
      strategyBadge.textContent = page.background_strategy;
      strategyBadge.className = `badge ${page.background_strategy}`;

      const complexityBadge = document.getElementById('complexityBadge');
      complexityBadge.textContent = page.background_complexity;
      complexityBadge.className = `badge ${page.background_complexity}`;

      // 渲染文本框列表
      renderTextBoxesList(page.text_boxes);

      // 渲染 overlay
      renderOverlays(page.text_boxes);

      // 更新问题提示
      if (page.issues && page.issues.length > 0) {
        const banner = document.getElementById('issuesBanner');
        banner.textContent = `⚠ ${page.issues.length} 处需要复核`;
        banner.style.display = 'block';
      } else {
        document.getElementById('issuesBanner').style.display = 'none';
      }

      // 更新翻页按钮状态
      document.getElementById('prevPage').disabled = pageIdx === 0;
      document.getElementById('nextPage').disabled = pageIdx === extractionData.pages.length - 1;
    }

    // 渲染文本框列表
    function renderTextBoxesList(boxes) {
      const list = document.getElementById('textBoxesList');
      list.innerHTML = '';

      boxes.forEach(box => {
        const item = document.createElement('div');
        item.className = 'text-box-item';
        if (box.id === selectedBoxId) item.classList.add('selected');
        item.dataset.boxId = box.id;

        const confidence = typeof box.confidence === 'number' ? box.confidence : 0.9;
        const confidenceClass = confidence < 0.75 ? 'low' : '';

        item.innerHTML = `
          <div class="box-header">
            <span class="box-role">${sanitizeLabel(box.role, 'body')}</span>
            <span class="box-confidence ${confidenceClass}">置信度: ${(confidence * 100).toFixed(0)}%</span>
          </div>
          <div class="box-text">
            <textarea></textarea>
          </div>
          <div class="box-actions">
            <select data-field="role">
              <option value="title" ${box.role === 'title' ? 'selected' : ''}>标题</option>
              <option value="subtitle" ${box.role === 'subtitle' ? 'selected' : ''}>副标题</option>
              <option value="body" ${box.role === 'body' ? 'selected' : ''}>正文</option>
              <option value="footer" ${box.role === 'footer' ? 'selected' : ''}>页脚</option>
              <option value="caption" ${box.role === 'caption' ? 'selected' : ''}>说明</option>
              <option value="label" ${box.role === 'label' ? 'selected' : ''}>标签</option>
              <option value="annotation" ${box.role === 'annotation' ? 'selected' : ''}>批注</option>
            </select>
            <select data-field="align">
              <option value="left" ${box.style_hint.align === 'left' ? 'selected' : ''}>左对齐</option>
              <option value="center" ${box.style_hint.align === 'center' ? 'selected' : ''}>居中</option>
              <option value="right" ${box.style_hint.align === 'right' ? 'selected' : ''}>右对齐</option>
            </select>
            <button class="danger" data-action="delete">删除</button>
          </div>
        `;
        item.querySelector('textarea').value = box.text;

        item.addEventListener('click', (e) => {
          if (!e.target.closest('textarea, select, button')) {
            selectBox(box.id);
          }
        });

        list.appendChild(item);
      });
    }

    // 渲染 overlay
    function renderOverlays(boxes) {
      const container = document.getElementById('overlayContainer');
      container.innerHTML = '';
      if (!overlayVisible) return;

      const img = document.getElementById('pageImage');
      boxes.forEach(box => {
        const overlay = document.createElement('div');
        overlay.className = 'text-box-overlay';
        if (box.id === selectedBoxId) overlay.classList.add('selected');
        overlay.dataset.boxId = box.id;

        const [x, y, w, h] = box.bbox_norm;
        overlay.style.left = `${x * 100}%`;
        overlay.style.top = `${y * 100}%`;
        overlay.style.width = `${w * 100}%`;
        overlay.style.height = `${h * 100}%`;

        const label = document.createElement('div');
        label.className = 'text-box-label';
        label.textContent = sanitizeLabel(box.role, 'body');
        overlay.appendChild(label);

        overlay.addEventListener('click', () => selectBox(box.id));

        container.appendChild(overlay);
      });
    }

    // 选中文本框
    function selectBox(boxId) {
      selectedBoxId = boxId;
      document.querySelectorAll('.text-box-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.boxId === boxId);
      });
      document.querySelectorAll('.text-box-overlay').forEach(el => {
        el.classList.toggle('selected', el.dataset.boxId === boxId);
      });
    }

    // 事件监听
    function setupEventListeners() {
      // 翻页
      document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPageIndex > 0) {
          currentPageIndex--;
          renderPage(currentPageIndex);
        }
      });

      document.getElementById('nextPage').addEventListener('click', () => {
        if (currentPageIndex < extractionData.pages.length - 1) {
          currentPageIndex++;
          renderPage(currentPageIndex);
        }
      });

      // 切换 overlay
      document.getElementById('toggleOverlay').addEventListener('click', (e) => {
        overlayVisible = !overlayVisible;
        e.target.textContent = overlayVisible ? '隐藏标注' : '显示标注';
        renderOverlays(extractionData.pages[currentPageIndex].text_boxes);
      });

      // 导出
      document.getElementById('exportBtn').addEventListener('click', exportData);

      // 添加文本框
      document.getElementById('addBoxBtn').addEventListener('click', () => {
        const page = extractionData.pages[currentPageIndex];
        const box = createDefaultBox(currentPageIndex);
        page.text_boxes.push(box);
        selectedBoxId = box.id;
        renderPage(currentPageIndex);
      });

      // 文本框编辑
      document.getElementById('textBoxesList').addEventListener('input', (e) => {
        if (e.target.tagName === 'TEXTAREA') {
          updateBoxText(e.target.closest('.text-box-item').dataset.boxId, e.target.value);
        }
      });

      document.getElementById('textBoxesList').addEventListener('change', (e) => {
        if (e.target.tagName === 'SELECT') {
          const boxId = e.target.closest('.text-box-item').dataset.boxId;
          const field = e.target.dataset.field;
          updateBoxField(boxId, field, e.target.value);
        }
      });

      document.getElementById('textBoxesList').addEventListener('click', (e) => {
        if (e.target.dataset.action === 'delete') {
          const boxId = e.target.closest('.text-box-item').dataset.boxId;
          deleteBox(boxId);
        }
      });
    }

    // 更新文本框内容
    function updateBoxText(boxId, newText) {
      const page = extractionData.pages[currentPageIndex];
      const box = page.text_boxes.find(b => b.id === boxId);
      if (box) box.text = newText;
    }

    // 更新文本框字段
    function updateBoxField(boxId, field, value) {
      const page = extractionData.pages[currentPageIndex];
      const box = page.text_boxes.find(b => b.id === boxId);
      if (!box) return;

      if (field === 'role') {
        box.role = value;
        renderOverlays(page.text_boxes);
      } else if (field === 'align') {
        box.style_hint.align = value;
      }
    }

    // 删除文本框
    function deleteBox(boxId) {
      if (!confirm('确定要删除这个文本框吗？')) return;
      const page = extractionData.pages[currentPageIndex];
      page.text_boxes = page.text_boxes.filter(b => b.id !== boxId);
      if (selectedBoxId === boxId) selectedBoxId = null;
      renderPage(currentPageIndex);
    }

    // 导出数据
    function exportData() {
      const output = `===PHASE-D / CONTENT EXTRACTION CONFIRMED===

本次从 PDF 提取了 ${extractionData.total_pages} 页内容，已在预览页确认。

===EXTRACTION JSON BEGIN===
${JSON.stringify(extractionData, null, 2)}
===EXTRACTION JSON END===`;

      const textarea = document.createElement('textarea');
      textarea.value = output;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);

      alert('已复制到剪贴板！\n请粘贴回对话框继续。');
    }

    // 启动
    init();
  </script>
</body>
</html>
